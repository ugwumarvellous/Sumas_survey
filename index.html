<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SUMAS Final Survey</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial;background:#f5f7fa}header{background:#003273;color:#fff;padding:14px;text-align:center;font-weight:bold}#map{height:42vh}.panel{padding:14px}.card{background:#fff;padding:10px;border-radius:12px;margin-bottom:10px}input,select,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:10px;color:#fff;background:#003273}.green{background:#0b8f4d}.red{background:#b52b2b}.gold{background:#d97706}</style></head><body><header>SUMAS Campus Survey Collector FINAL</header><div id="map"></div><div class="panel"><div class="card"><b>Status:</b> <span id="status">Ready</span><br>Walk points: <span id="count">0</span> | Distance: <span id="dist">0</span> m | Time: <span id="timer">00:00</span></div><button id="gps">📍 Get My Location</button><button id="start" class="green">🚶 Start Walk</button><button id="stop" class="red">🛑 Stop Walk</button><input id="id" placeholder="Location ID"><input id="name" placeholder="Building Name"><select id="cat"><option>Department</option><option>Faculty</option><option>Library</option><option>Medical Centre</option><option>Gate</option><option>Road Junction</option><option>Walkway Point</option><option>Hostel</option><option>Other</option></select><input id="landmark" placeholder="Nearby Landmark"><input id="lat" placeholder="Latitude" readonly><input id="lng" placeholder="Longitude" readonly><input id="acc" placeholder="GPS Accuracy" readonly><textarea id="notes" rows="3" placeholder="Notes"></textarea><button id="save" class="green">💾 Save Building</button><button id="bexp">⬇ Export Buildings CSV</button><button id="wexp" class="gold">⬇ Export Walk CSV</button><button id="clear" class="red">Clear Saved Data</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=i=>document.getElementById(i),map=L.map("map").setView([6.87,7.39],16);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);let marker,line,watch=null,walking=false,last=null,meters=0,sec=0,intv=null,buildings=JSON.parse(localStorage.getItem("sumas_buildings")||"[]"),walk=JSON.parse(localStorage.getItem("sumas_walk")||"[]");function draw(){if(line)map.removeLayer(line);if(walk.length)line=L.polyline(walk,{color:"blue",weight:5}).addTo(map);$("count").textContent=walk.length}draw();buildings.forEach(b=>L.circleMarker([b.lat,b.lng],{radius:5}).addTo(map));function dist(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}$("gps").onclick=()=>navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;$("lat").value=lat.toFixed(6);$("lng").value=lng.toFixed(6);$("acc").value=Math.round(p.coords.accuracy)+" m";if(marker)map.removeLayer(marker);marker=L.marker([lat,lng]).addTo(map);map.setView([lat,lng],19);$("status").textContent="Location captured"},e=>$("status").textContent=e.message,{enableHighAccuracy:true});$("start").onclick=()=>{if(walking)return;walking=true;last=null;meters=0;sec=0;$("status").textContent="Walking";intv=setInterval(()=>{$("timer").textContent=String(Math.floor(++sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);watch=navigator.geolocation.watchPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;if(last){const m=dist(last.lat,last.lng,lat,lng);if(m<5)return;meters+=m;$("dist").textContent=Math.round(meters)}last={lat,lng};walk.push([lat,lng]);localStorage.setItem("sumas_walk",JSON.stringify(walk));draw();map.setView([lat,lng],19)},e=>alert(e.message),{enableHighAccuracy:true,maximumAge:0,timeout:1e4})};$("stop").onclick=()=>{if(!walking)return;navigator.geolocation.clearWatch(watch);clearInterval(intv);walking=false;$("status").textContent="Walk saved"};$("save").onclick=()=>{if(!$("lat").value){alert("Capture GPS first");return}const b={id:$("id").value,name:$("name").value,cat:$("cat").value,landmark:$("landmark").value,lat:$("lat").value,lng:$("lng").value,acc:$("acc").value,notes:$("notes").value};buildings.push(b);localStorage.setItem("sumas_buildings",JSON.stringify(buildings));L.circleMarker([b.lat,b.lng],{radius:5}).addTo(map);$("status").textContent="Building saved";["id","name","landmark","notes"].forEach(x=>$(x).value="")};function dl(n,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=n;a.click()}$("bexp").onclick=()=>{let c="ID,Name,Category,Landmark,Latitude,Longitude,Accuracy,Notes\n";buildings.forEach(b=>c+=`"${b.id}","${b.name}","${b.cat}","${b.landmark}","${b.lat}","${b.lng}","${b.acc}","${b.notes}"\n`);dl("SUMAS_Buildings.csv",c)};$("wexp").onclick=()=>{let c="Latitude,Longitude\n";walk.forEach(p=>c+=p[0]+","+p[1]+"\n");dl("SUMAS_Walk.csv",c)};$("clear").onclick=()=>{if(confirm("Delete all saved data?")){localStorage.removeItem("sumas_buildings");localStorage.removeItem("sumas_walk");location.reload()}};</script></body></html>
