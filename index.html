
<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>SUMAS GPS Survey Collector</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/>
<style>body{margin:0;font-family:Arial;background:#f4f6f8}header{background:#003273;color:#fff;padding:15px;text-align:center;font-weight:bold}#map{height:45vh}.panel{padding:15px}input,select,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;background:#003273;color:#fff}.secondary{background:#0b8f4d}.info{background:#fff;padding:12px;border-radius:8px;margin-bottom:10px}</style></head><body>
<header>SUMAS GPS Survey Collector</header><div id='map'></div><div class='panel'><div class='info'><b>Status:</b> <span id='status'>Ready</span></div><button id='locBtn'>📍 Get My Location</button><input id='id' placeholder='Location ID'><input id='name' placeholder='Building Name'><select id='category'><option>Department</option><option>Faculty</option><option>Library</option><option>Medical Centre</option><option>Gate</option><option>Road Junction</option><option>Walkway Point</option><option>Other</option></select><input id='landmark' placeholder='Nearby Landmark'><input id='lat' placeholder='Latitude' readonly><input id='lng' placeholder='Longitude' readonly><input id='accuracy' placeholder='GPS Accuracy' readonly><textarea id='notes' rows='3' placeholder='Notes'></textarea><button class='secondary' id='saveBtn'>💾 Save Record</button><button id='exportBtn'>⬇ Export CSV</button><div class='info'>Records: <span id='count'>0</span></div></div>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>
const map=L.map('map').setView([6.87,7.39],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let marker;let records=[];const $=id=>document.getElementById(id);
$('locBtn').onclick=()=>{if(!navigator.geolocation){$('status').textContent='No GPS';return;}$('status').textContent='Getting GPS...';navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;$('lat').value=lat.toFixed(6);$('lng').value=lng.toFixed(6);$('accuracy').value=Math.round(p.coords.accuracy)+' m';map.setView([lat,lng],19);if(marker)map.removeLayer(marker);marker=L.marker([lat,lng]).addTo(map);$('status').textContent='Location captured';},e=>{$('status').textContent=e.message;},{enableHighAccuracy:true,timeout:10000,maximumAge:0});};
map.on('click',e=>{const lat=e.latlng.lat,lng=e.latlng.lng;$('lat').value=lat.toFixed(6);$('lng').value=lng.toFixed(6);if(marker)map.removeLayer(marker);marker=L.marker([lat,lng]).addTo(map);$('status').textContent='Map point selected';});
$('saveBtn').onclick=()=>{if(!$('lat').value){alert('Capture location first');return;}const r={id:$('id').value,name:$('name').value,category:$('category').value,landmark:$('landmark').value,latitude:$('lat').value,longitude:$('lng').value,accuracy:$('accuracy').value,notes:$('notes').value};records.push(r);L.circleMarker([parseFloat(r.latitude),parseFloat(r.longitude)],{radius:5}).addTo(map);$('count').textContent=records.length;$('id').value='';$('name').value='';$('landmark').value='';$('notes').value='';};
$('exportBtn').onclick=()=>{if(records.length===0){alert('No records');return;}let csv='ID,Name,Category,Landmark,Latitude,Longitude,Accuracy,Notes\n';records.forEach(r=>csv+=`"${r.id}","${r.name}","${r.category}","${r.landmark}","${r.latitude}","${r.longitude}","${r.accuracy}","${r.notes}"\n`);const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SUMAS_Campus_Coordinates.csv';a.click();};
</script></body></html>
