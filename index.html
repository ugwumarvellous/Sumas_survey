<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>SUMAS GPS Survey Collector V2</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><style>body{margin:0;font-family:Arial;background:#f4f6f8}header{background:#003273;color:#fff;padding:14px;text-align:center;font-size:20px;font-weight:bold}#map{height:45vh}.panel{padding:14px}input,select,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;background:#003273;color:#fff}.green{background:#0b8f4d}.red{background:#b52b2b}.orange{background:#d97706}.card{background:#fff;padding:10px;border-radius:8px;margin-bottom:10px}</style></head><body><header>SUMAS GPS Survey Collector V2</header><div id='map'></div><div class='panel'><div class='card'><b>Status:</b> <span id='status'>Ready</span><br><small>GPS points: <span id='points'>0</span></small></div><button id='locBtn'>📍 Get My Location</button><button id='startWalk' class='green'>🚶 Start Walk</button><button id='stopWalk' class='red'>🛑 Stop Walk</button><input id='id' placeholder='Location ID'><input id='name' placeholder='Building Name'><select id='category'><option>Department</option><option>Faculty</option><option>Library</option><option>Medical Centre</option><option>Gate</option><option>Road Junction</option><option>Walkway Point</option><option>Other</option></select><input id='landmark' placeholder='Nearby Landmark'><input id='lat' placeholder='Latitude' readonly><input id='lng' placeholder='Longitude' readonly><input id='accuracy' placeholder='GPS Accuracy' readonly><textarea id='notes' rows='3' placeholder='Notes'></textarea><button id='saveBtn' class='green'>💾 Save Building</button><button id='exportBuildings'>⬇ Export Buildings CSV</button><button id='exportWalk' class='orange'>⬇ Export Walk CSV</button></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>const map=L.map('map').setView([6.87,7.39],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const $=id=>document.getElementById(id);let marker=null,buildings=JSON.parse(localStorage.getItem('sumasBuildings')||'[]');let walkPoints=JSON.parse(localStorage.getItem('sumasWalk')||'[]');let watchId=null,walking=false,lastPoint=null,walkLine=null;function drawWalk(){if(walkLine)map.removeLayer(walkLine);if(walkPoints.length)walkLine=L.polyline(walkPoints,{color:'blue',weight:5}).addTo(map);$('points').textContent=walkPoints.length;}drawWalk();buildings.forEach(b=>L.circleMarker([b.latitude,b.longitude],{radius:5}).addTo(map));function dist(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p;const h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}$('locBtn').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;$('lat').value=lat.toFixed(6);$('lng').value=lng.toFixed(6);$('accuracy').value=Math.round(p.coords.accuracy)+' m';if(marker)map.removeLayer(marker);marker=L.marker([lat,lng]).addTo(map);map.setView([lat,lng],19);$('status').textContent='Location captured';},e=>$('status').textContent=e.message,{enableHighAccuracy:true});map.on('click',e=>{const lat=e.latlng.lat,lng=e.latlng.lng;$('lat').value=lat.toFixed(6);$('lng').value=lng.toFixed(6);if(marker)map.removeLayer(marker);marker=L.marker([lat,lng]).addTo(map);$('status').textContent='Map point selected';});$('startWalk').onclick=()=>{if(walking)return;walking=true;lastPoint=null;$('status').textContent='Walk Mode Started';watchId=navigator.geolocation.watchPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;if(lastPoint&&dist(lastPoint.lat,lastPoint.lng,lat,lng)<5)return;lastPoint={lat,lng};walkPoints.push([lat,lng]);localStorage.setItem('sumasWalk',JSON.stringify(walkPoints));drawWalk();map.setView([lat,lng],19);},e=>alert(e.message),{enableHighAccuracy:true,maximumAge:0,timeout:10000});};$('stopWalk').onclick=()=>{if(!walking)return;navigator.geolocation.clearWatch(watchId);walking=false;$('status').textContent='Walk stopped';};$('saveBtn').onclick=()=>{if(!$('lat').value){alert('Capture location first');return;}const b={id:$('id').value,name:$('name').value,category:$('category').value,landmark:$('landmark').value,latitude:$('lat').value,longitude:$('lng').value,accuracy:$('accuracy').value,notes:$('notes').value};buildings.push(b);localStorage.setItem('sumasBuildings',JSON.stringify(buildings));L.circleMarker([b.latitude,b.longitude],{radius:5}).addTo(map);$('status').textContent='Building saved';$('id').value='';$('name').value='';$('landmark').value='';$('notes').value='';};function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click();}$('exportBuildings').onclick=()=>{let csv='ID,Name,Category,Landmark,Latitude,Longitude,Accuracy,Notes\n';buildings.forEach(b=>csv+='"'+b.id+'","'+b.name+'","'+b.category+'","'+b.landmark+'","'+b.latitude+'","'+b.longitude+'","'+b.accuracy+'","'+b.notes+'"\n');dl('SUMAS_Buildings.csv',csv);};$('exportWalk').onclick=()=>{let csv='Latitude,Longitude\n';walkPoints.forEach(p=>csv+=p[0]+','+p[1]+'\n');dl('SUMAS_Walk_Path.csv',csv);};</script></body></html>
